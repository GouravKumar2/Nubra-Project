<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Nubra · Your first options trade</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
    <style>
        :root {
            --bg: #050814;
            --s1: #0F1426;
            --s2: #151B30;
            --bd: rgba(255, 255, 255, .06);
            --ac: #5B6EF5;
            --ac2: #8FA0FF;
            --tx: #fff;
            --mu: #8B93B0;
            --g: #3DBE7A;
            --r: #EF4B5B;
            --am: #F5A524
        }

        @media(prefers-color-scheme:light) {
            :root {
                color-scheme: dark
            }
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: radial-gradient(900px 400px at 40% -80px, rgba(91, 110, 245, .22), transparent), var(--bg);
            color: var(--tx);
            font: 15px/1.5 Inter, system-ui, sans-serif;
            padding: env(safe-area-inset-top, 0px) 0 calc(env(safe-area-inset-bottom, 0px) + 70px)
        }

        .n {
            font-variant-numeric: tabular-nums
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1240px;
            margin: 0 auto;
            padding: 18px 24px
        }

        .logo {
            font-weight: 800;
            font-size: 20px;
            display: flex;
            gap: 8px;
            align-items: center
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        .out {
            background: none;
            border: 1px solid var(--ac);
            color: var(--ac2);
            padding: 8px 16px;
            border-radius: 10px
        }

        :focus-visible {
            outline: 2px solid var(--ac2);
            outline-offset: 2px
        }

        .wrap {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 24px
        }

        .prog {
            margin: 4px 0 22px;
            pointer-events: none;
            user-select: none
        }

        .bar {
            height: 4px;
            background: var(--s2);
            border-radius: 4px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--ac), var(--ac2));
            transition: width .4s
        }

        .labs {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--mu);
            opacity: .45
        }

        .labs .done {
            opacity: 1
        }

        .labs .cur {
            color: var(--ac2);
            opacity: 1;
            font-weight: 600
        }

        .grid {
            display: grid;
            grid-template-columns: 65fr 35fr;
            gap: 28px;
            align-items: start
        }

        .card {
            background: var(--s1);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 28px
        }

        h1 {
            font-size: 30px;
            line-height: 1.2;
            margin: 6px 0 18px;
            font-weight: 800
        }

        .gr {
            background: linear-gradient(90deg, #fff, var(--ac2));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .back {
            background: none;
            border: 0;
            color: var(--mu);
            padding: 4px 0;
            margin-bottom: 6px
        }

        .back:hover {
            color: #fff
        }

        .help {
            color: var(--mu);
            font-size: 14px;
            margin: 12px 0 0
        }

        small,
        .mk {
            color: var(--mu);
            font-size: .8em;
            font-weight: 400
        }

        .t {
            border-bottom: 1px dotted var(--ac2);
            cursor: help;
            position: relative
        }

        .t:hover::after,
        .t:focus::after {
            content: attr(data-tip);
            position: absolute;
            left: 0;
            top: 120%;
            background: var(--s2);
            border: 1px solid var(--bd);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 9;
            color: #fff
        }

        .opts {
            display: grid;
            gap: 10px
        }

        .opts.c3 {
            grid-template-columns: repeat(3, 1fr)
        }

        .opt {
            text-align: left;
            background: var(--s2);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 14px;
            display: block;
            width: 100%
        }

        .opt[aria-pressed=true] {
            border-color: var(--ac);
            box-shadow: 0 0 0 1px var(--ac) inset
        }

        .opt:hover {
            border-color: rgba(255, 255, 255, .2)
        }

        .opt.dim {
            opacity: .7
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .big {
            font-size: 26px;
            font-weight: 800
        }

        .mut {
            color: var(--mu);
            font-size: 13px
        }

        .stocks {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            margin-top: 10px;
            max-height: 230px;
            overflow: auto
        }

        input[type=text],
        input[type=number],
        input[type=search] {
            background: var(--s2);
            border: 1px solid var(--bd);
            color: #fff;
            border-radius: 10px;
            padding: 10px 12px;
            font: inherit;
            width: 100%
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--ac)
        }

        .sec {
            margin-top: 22px
        }

        .sec>h2 {
            font-size: 15px;
            margin: 0 0 8px;
            color: var(--mu);
            font-weight: 600
        }

        .foot {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 16px;
            margin-top: 26px
        }

        .prim {
            background: linear-gradient(90deg, var(--ac), #6B7FE8);
            border: 0;
            color: #fff;
            padding: 12px 26px;
            border-radius: 12px;
            font-weight: 700
        }

        .prim:disabled {
            opacity: .35;
            cursor: not-allowed
        }

        .why {
            color: var(--mu);
            font-size: 13px
        }

        .tiles {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px
        }

        .tile {
            background: var(--s2);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid var(--bd)
        }

        .tile .big {
            font-size: 22px;
            margin: 4px 0
        }

        .g {
            color: var(--g)
        }

        .rd {
            color: var(--r)
        }

        .am {
            color: var(--am)
        }

        .warn {
            border: 1px solid var(--am);
            background: rgba(245, 165, 36, .08);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 10px;
            font-size: 14px;
            color: var(--am)
        }

        .note {
            color: var(--ac2);
            font-size: 13px;
            margin: 0 0 10px
        }

        .cmp {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        details {
            margin-top: 10px;
            color: var(--mu);
            font-size: 13px
        }

        summary {
            cursor: pointer;
            color: var(--ac2)
        }

        .slip {
            position: sticky;
            top: 16px;
            background: var(--s1);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 22px 22px 18px;
            -webkit-mask: radial-gradient(circle 7px at 0 62%, #0000 98%, #000) left/51% 100% no-repeat, radial-gradient(circle 7px at 100% 62%, #0000 98%, #000) right/51% 100% no-repeat;
            mask: radial-gradient(circle 7px at 0 62%, #0000 98%, #000) left/51% 100% no-repeat, radial-gradient(circle 7px at 100% 62%, #0000 98%, #000) right/51% 100% no-repeat
        }

        .slip h3 {
            margin: 0 0 12px;
            font-size: 13px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--mu)
        }

        .ln {
            padding: 8px 0;
            border-bottom: 1px solid var(--bd);
            animation: in .4s
        }

        .ln.ph {
            border: 1px dashed rgba(255, 255, 255, .14);
            border-radius: 8px;
            color: #5a6280;
            padding: 7px 10px;
            margin: 5px 0;
            animation: none
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(6px)
            }
        }

        .sb {
            margin-top: 10px;
            border-top: 2px dashed rgba(255, 255, 255, .12);
            padding-top: 12px
        }

        .sb .l {
            background: rgba(239, 75, 91, .1);
            border: 1px solid rgba(239, 75, 91, .4);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 8px
        }

        #mbar {
            display: none
        }

        svg text {
            fill: var(--mu);
            font-size: 11px
        }

        .fn {
            text-align: center;
            color: var(--mu);
            font-size: 12px;
            padding: 30px 24px
        }

        @media(max-width:900px) {
            .grid {
                grid-template-columns: 1fr
            }

            .slip {
                display: none
            }

            h1 {
                font-size: 24px
            }

            .tiles,
            .opts.c3,
            .cmp {
                grid-template-columns: 1fr
            }

            .card {
                padding: 18px
            }

            #mbar {
                display: flex;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                background: var(--s2);
                border-top: 1px solid var(--bd);
                padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px));
                justify-content: space-between;
                width: 100%;
                border-radius: 16px 16px 0 0;
                z-index: 20;
                border-left: 0;
                border-right: 0
            }

            body.sheet .slip {
                display: block;
                position: fixed;
                left: 0;
                right: 0;
                bottom: 50px;
                z-index: 19;
                border-radius: 16px 16px 0 0;
                max-height: 70vh;
                overflow: auto
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            height: 30px;
            background: transparent;
            touch-action: none;
            cursor: pointer;
            margin: 4px 0
        }

        input[type=range]::-webkit-slider-runnable-track {
            height: 6px;
            background: var(--s2);
            border-radius: 3px
        }

        input[type=range]::-moz-range-track {
            height: 6px;
            background: var(--s2);
            border-radius: 3px
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--ac);
            margin-top: -9px
        }

        input[type=range]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid var(--ac)
        }

        .hold {
            position: relative;
            overflow: hidden;
            min-width: 260px;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none
        }

        .hold i {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: rgba(255, 255, 255, .3)
        }

        .hold span {
            position: relative
        }

        .opt.sel {
            border-color: var(--ac);
            box-shadow: 0 0 0 1px var(--ac) inset, 0 0 18px rgba(91, 110, 245, .25)
        }

        .ackb {
            min-height: 40px;
            margin-top: 8px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid var(--am);
            color: var(--am);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background .15s
        }

        .ackb:hover {
            background: rgba(245, 165, 36, .15)
        }

        .ackb:active {
            background: rgba(245, 165, 36, .28);
            transform: translateY(1px)
        }

        .ackb.ok {
            background: rgba(245, 165, 36, .18);
            color: #fff
        }

        .card.chc {
            padding: 24px;
            margin-top: 16px;
            background: var(--s2)
        }

        .chc .ct {
            font-size: 20px;
            line-height: 1.3;
            margin: 0 0 6px;
            font-weight: 700;
            color: #fff
        }

        .chc .cap {
            margin: 0 0 14px;
            color: var(--mu);
            font-size: 13px;
            line-height: 1.5
        }

        .ro {
            background: var(--s1);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 16px;
            line-height: 1.45;
            min-height: 56px;
            margin-bottom: 14px
        }

        .ro .of {
            color: var(--mu);
            font-size: 14px
        }

        #cs text {
            font-family: inherit
        }

        #cs .tk {
            fill: #8B93B0;
            font-size: 12px
        }

        #cs .at {
            fill: #AEB6D8;
            font-size: 13px;
            font-weight: 600
        }

        #cs .bl {
            font-size: 12px;
            font-weight: 700
        }

        #cs .pt {
            fill: #fff;
            font-size: 12px;
            font-weight: 600
        }

        #cs .hl {
            font-size: 12px;
            font-weight: 600;
            paint-order: stroke;
            stroke: #151B30;
            stroke-width: 4px;
            stroke-linejoin: round
        }

        #cs .pl {
            stroke-dasharray: 1;
            stroke-dashoffset: 0
        }

        #cs .pl.an {
            animation: draw .55s ease-out
        }

        @keyframes draw {
            from {
                stroke-dashoffset: 1
            }
        }

        #hd {
            cursor: grab;
            outline: none
        }

        #hd:focus-visible circle:nth-child(3) {
            stroke: #8FA0FF;
            stroke-width: 4
        }

        .sc5 {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px
        }

        .sc5>div {
            background: var(--s2);
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            line-height: 1.35
        }

        .sc5 b {
            font-size: 13px;
            display: block
        }

        .sc5 .l {
            font-size: 11px;
            color: var(--mu);
            display: block;
            margin-top: 5px
        }

        .sc5 .h {
            font-size: 13px;
            font-weight: 700;
            display: block
        }

        .sc5 .cx {
            display: none
        }

        @media(max-width:900px) {
            .card.chc {
                padding: 20px
            }
        }

        @media(max-width:600px) {
            .sc5 .fx {
                display: none
            }

            .sc5 .cx {
                display: inline
            }

            .sc5 {
                gap: 4px
            }

            .sc5>div {
                padding: 8px 1px
            }

            .sc5 b {
                font-size: 11.5px;
                white-space: nowrap;
                letter-spacing: -.2px
            }

            .sc5 .h {
                font-size: 12.5px
            }
        }

        @media(max-width:520px) {
            .card.chc {
                padding: 16px
            }

            .chc .ct {
                font-size: 18px
            }

            .ro {
                font-size: 15px;
                min-height: 84px
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo"><svg width="26" height="20" viewBox="0 0 26 20" aria-hidden="true">
                <path d="M2 14l6-8 5 6 5-9 6 8" fill="none" stroke="#6B7FE8" stroke-width="3" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>nubra</div>
    </nav>
    <div class="wrap">
        <div class="prog" id="prog"></div>
        <div class="grid">
            <main class="card" id="main"></main>
            <aside class="slip" id="slip" aria-label="Your trade slip"></aside>
        </div>
    </div>
    <button id="mbar" aria-expanded="false"></button>
    <div class="fn">Educational prototype. Prices are illustrative, not live. No real orders are placed.</div>
    <script>
        const $ = s => document.querySelector(s);
        const INR = n => '₹' + Math.round(n).toLocaleString('en-IN');
        const PCT = (a, b) => (a / b * 100).toFixed(a / b * 100 < 10 ? 1 : 0) + '%';
        const STOCKS = [['RELIANCE', 2500, 250, .22], ['HDFCBANK', 1650, 550, .20], ['TCS', 3900, 175, .19], ['INFY', 1500, 400, .24], ['SBIN', 800, 750, .25], ['ICICIBANK', 1250, 700, .21], ['ITC', 470, 1600, .20], ['TATAMOTORS', 950, 1425, .30], ['NIFTY 50', 24500, 75, .16], ['BANK NIFTY', 52000, 30, .18], ['AXISBANK', 1150, 625, .23], ['LT', 3500, 175, .21]].map(([s, p, l, iv], i) => ({ s, p, l, iv, i }));
        // ---- engine
        const N = x => { const t = 1 / (1 + .2316419 * Math.abs(x)), d = .3989423 * Math.exp(-x * x / 2), p = d * t * (.3193815 + t * (-.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p };
        const R = .065;
        function bs(type, S, K, T, v) { if (T <= 0) return Math.max(type == 'call' ? S - K : K - S, 0); const d1 = (Math.log(S / K) + (R + v * v / 2) * T) / (v * Math.sqrt(T)), d2 = d1 - v * Math.sqrt(T); return type == 'call' ? S * N(d1) - K * Math.exp(-R * T) * N(d2) : K * Math.exp(-R * T) * N(-d2) - S * N(-d1) }
        const pnl = (o, S) => ((o.type == 'call' ? Math.max(S - o.strike, 0) : Math.max(o.strike - S, 0)) - o.premium) * o.lotSize * o.lots;
        const be = o => o.type == 'call' ? o.strike + o.premium : o.strike - o.premium;
        const maxLoss = o => o.premium * o.lotSize * o.lots;
        const maxProfit = o => o.type == 'call' ? Infinity : (o.strike - o.premium) * o.lotSize * o.lots;
        const TODAY = (() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()) })();
        const dayAt = d => new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() + d);
        const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const dstr = d => { const x = dayAt(d); return DOW[x.getDay()] + ', ' + x.getDate() + ' ' + MON[x.getMonth()] };
        const D1 = (() => { let d = 3; while (dayAt(d).getDay() != 4) d++; return d })();
        const EXPIRIES = [D1, D1 + 7, D1 + 21];
        const chg = '<p class="mut" style="font-size:12px;margin:16px 0 0">Illustrative prices. Brokerage, taxes and other charges are not included.</p>';
        function chain(st, type, days) {
            const T = days / 365, step = st.p > 10000 ? 100 : st.p > 2000 ? 50 : st.p > 500 ? 10 : 5, rnd = x => Math.round(x / step) * step, sg = type == 'call' ? 1 : -1;
            return [[.04, 'Cheaper, less likely to pay off'], [.02, 'Balanced'], [0, 'Costlier, more likely to pay off']].map(([off, label]) => {
                const K = rnd(st.p * (1 + sg * off)); const pr = Math.max(.05, Math.round(bs(type, st.p, K, T, st.iv) / .05) * .05);
                const o = { type, strike: K, premium: +pr.toFixed(2), lots: 1, lotSize: st.l, expiryDays: days }; return { o, label }
            })
        }
        // ---- state
        const S = { step: 1, stock: null, view: null, notsure: false, days: null, capital: 100000, comfy: null, cm: false, ctext: '', cv: null, opt: null, lots: 1, ack: false, move: 10, pick: null, typed: '', chk: false, done: false, note: '', time: false };
        const V = { pick: null, anim: false, hint: true };
        const STEPS = ['Your view', 'Your limit', 'Choose option', 'Worst case', 'Review'];
        const INTRO = { 1: ['option', 'call/put'], 2: ['fee'], 3: ['strike', 'expiry'], 4: ['be'] };
        const TERMS = { option: ['An option', 'Option'], fee: ['Option price', 'Premium'], strike: ['Locked price', 'Strike price'], expiry: ['Deadline', 'Expiry'], be: ['Break-even price', 'Breakeven'], call: ['Reserve to buy', 'Call'], put: ['Reserve to sell', 'Put'] };
        let seen = [];
        function T(k) {
            const [p, m] = TERMS[k]; const first = (INTRO[S.step] || []).includes(k) || k == 'call' && S.step == 1 || k == 'put' && S.step == 1 || k == 'option' && S.step == 1;
            if (first) { seen.push(k); return `${p} <small>(${m})</small>` } return `<span class="t" tabindex="0" data-tip="${m}">${p}</span>`
        }
        const stk = () => STOCKS[S.stock], type = () => S.view ? (S.view == 'down' ? 'put' : 'call') : (S.nsType || 'call');
        const cur = () => { if (S.stock == null || (!S.view && !S.notsure) || S.days == null || S.opt == null) return null; const c = chain(stk(), type(), S.days)[S.opt]; return { ...c.o, lots: S.lots, label: c.label, ch: c.ch } };
        const spark = i => { let y = 10, p = []; for (let k = 0; k < 20; k++) { y += Math.sin(k * 1.3 + i * 2.1) * 3 + Math.cos(k * .7 + i) * 2; p.push(k * 4 + ',' + (30 - y * .6)) } return `<svg width="76" height="30" viewBox="0 0 76 30"><polyline points="${p.join(' ')}" fill="none" stroke="#8FA0FF" stroke-width="1.5"/></svg>` };
